name: "🐛 Bug Report"
description: File a bug report or error encountered during installation or execution
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if your problem has already been reported before submitting.
  - type: input
    id: environment
    attributes:
      label: Environment & OS Version
      description: e.g. Proxmox VE 8.2 / Alpine Linux 3.21 LXC / Debian 12
      placeholder: Alpine Linux 3.21 (LXC)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installer Version
      description: Run `./install_unbound_interactive.sh --help` or check `SCRIPT_VERSION`
      placeholder: v4.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run `sh -c "$(wget -qO- https://...)"`
        2. Select Option X
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant logs from `/var/log/adguard-unbound-installer.log`
      render: shell
