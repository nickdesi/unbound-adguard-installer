name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - \'.jules/**\'
      - \'**.md\'
  pull_request:
    branches: [main]
    paths-ignore:
      - \'.jules/**\'
      - \'**.md\'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run shellcheck
        run: shellcheck install_unbound_interactive.sh lib/common.sh lib/health_checks.sh tests/test_suite.sh setup.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run test suite
        run: bash tests/test_suite.sh
